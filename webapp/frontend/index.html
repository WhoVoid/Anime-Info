<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Info</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top progress bar for non-blocking loading feedback -->
  <div id="top-loader" class="top-loader"></div>

  <div id="app">
    <!-- SCREEN 1: DISCOVER & MAIN CATALOG -->
    <section id="screen-home" class="screen active">
      <header class="app-header">
        <div class="brand">
          <span class="brand-title">Anime Info</span>
        </div>
        <div id="user-greeting" class="user-greeting"></div>
      </header>

      <div class="search-container">
        <div class="search-box">
          <span class="search-icon">›</span>
          <input id="search-input" type="text" placeholder="Search anime by title..." autocomplete="off">
          <button id="search-clear" class="search-clear hidden">×</button>
        </div>
      </div>

      <!-- Search results view -->
      <div id="search-results-wrap" class="hidden">
        <div class="section-header">
          <span class="section-title">Search Results</span>
          <span id="search-count" class="section-meta"></span>
        </div>
        <div id="search-results" class="grid-layout"></div>
      </div>

      <!-- Main Home Content with Integrated Catalog & Genre Options -->
      <div id="home-content">
        <div class="section-header">
          <span class="section-title">Trending Titles</span>
          <span class="section-badge">Popular</span>
        </div>
        <div id="carousel" class="horizontal-scroll">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <div class="section-header" style="margin-top: 18px;">
          <span class="section-title">Browse Catalog</span>
          <span class="section-meta" id="catalog-meta">All Titles</span>
        </div>

        <!-- Integrated Catalog Filter Bar + Genre Pills -->
        <div class="filter-container">
          <div id="filter-strip" class="filter-strip">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="trending">Trending</button>
            <button class="filter-chip" data-filter="new">New Releases</button>
            <button class="filter-chip" data-filter="popular">Popular</button>
            <button class="filter-chip" data-filter="Action">Action</button>
            <button class="filter-chip" data-filter="Adventure">Adventure</button>
            <button class="filter-chip" data-filter="Comedy">Comedy</button>
            <button class="filter-chip" data-filter="Drama">Drama</button>
            <button class="filter-chip" data-filter="Fantasy">Fantasy</button>
            <button class="filter-chip" data-filter="Horror">Horror</button>
            <button class="filter-chip" data-filter="Romance">Romance</button>
            <button class="filter-chip" data-filter="Sci-Fi">Sci-Fi</button>
            <button class="filter-chip" data-filter="Slice of Life">Slice of Life</button>
            <button class="filter-chip" data-filter="Sports">Sports</button>
            <button class="filter-chip" data-filter="Supernatural">Supernatural</button>
            <button class="filter-chip" data-filter="Thriller">Thriller</button>
          </div>
        </div>

        <div id="catalog-content">
          <div class="loading-state">
            <div class="spinner-ring"></div>
            <span>Loading catalog...</span>
          </div>
        </div>

      </div>
    </section>

    <!-- SCREEN 2: MY LIBRARY (WATCHLIST, WATCHED, FAVORITES & FRANCHISE GROUPING) -->
    <section id="screen-library" class="screen">
      <header class="app-header">
        <div class="brand">
          <span class="brand-title">My Library</span>
        </div>
      </header>

      <div class="library-tabs">
        <button class="lib-tab active" data-tab="watchlist">Watchlist</button>
        <button class="lib-tab" data-tab="watched">Watched</button>
        <button class="lib-tab" data-tab="favorites">Favorites</button>
        <button class="lib-tab" data-tab="franchises">Franchises</button>
      </div>

      <div id="library-content" class="library-container">
        <div class="loading-state">
          <div class="spinner-ring"></div>
          <span>Loading your library...</span>
        </div>
      </div>
    </section>

    <!-- SCREEN 3: DETAIL VIEW -->
    <section id="screen-detail" class="screen">
      <div class="detail-top-nav">
        <button id="back-btn" class="nav-back-btn">‹ Back</button>
        <button id="detail-fav-quick" class="quick-fav-btn">☆</button>
      </div>
      <div id="detail-content"></div>
    </section>
  </div>

  <!-- Persistent Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">
      <span class="nav-sym">●</span>
      <span class="nav-text">Discover</span>
    </button>
    <button class="nav-item" data-screen="library">
      <span class="nav-sym">▤</span>
      <span class="nav-text">Library</span>
    </button>
  </nav>

  <!-- Toast Notification Feedback -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
